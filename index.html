    <style>
      html, body { margin: 0; padding: 0; width: 100%; }
      html.light, html.light body { background-color: #f1f2ec; }
      html.dark, html.dark body { background-color: #0d120f; }
    </style>
    <script>
      (function () {
        var isInIframe = window.self !== window.top;
        function applyThemeToDOM(theme) {
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute("data-theme", theme);
        }
        function resolveInitial() {
          try {
            var stored = window.localStorage.getItem("moneta-theme");
            if (stored === "light" || stored === "dark") return stored;
          } catch (e) {}
          if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) return "dark";
          return "light";
        }
        if (isInIframe) {
          window.addEventListener("message", function (event) {
            if (event.data && typeof event.data.theme === "string") {
              var theme = event.data.theme;
              if (theme === "light" || theme === "dark") applyThemeToDOM(theme);
            }
          });
        }
        applyThemeToDOM(resolveInitial());
      })();
    </script>
    <script>
      (function () {
        if (window.self === window.top) return;
        var reported = {};
        window.addEventListener("error", function (event) {
          if (!event || !event.message) return;
          var key = event.message + "|" + (event.filename || "") + "|" + (event.lineno || 0);
          if (reported[key]) return;
          reported[key] = true;
          try {
            window.parent.postMessage(
              {
                type: "sandbox-runtime-error",
                payload: {
                  message: String(event.message).slice(0, 500),
                  filename: event.filename || "",
                  lineno: event.lineno || 0,
                  colno: event.colno || 0,
                  stack: event.error && event.error.stack ? String(event.error.stack).slice(0, 2000) : ""
                }
              },
              "*"
            );
          } catch (e) {}
        });
      })();
    </script>

  <body>
    <div id="root"></div>
    <!--
      Автономный «сторож»: работает на чистом JS, не зависит от бандла.
      Если через 6 секунд #root остался пустым (бандл не догрузился или React
      молча не нарисовал DOM), показываем понятную диагностику вместо чёрного
      экрана. Отменяется, как только приложение что-то нарисовало.
    -->
    <script>
      (function () {
        var painted = false;
        var root = document.getElementById("root");
        if (!root) return;
        var observer = new MutationObserver(function () {
          if (root.childElementCount > 0) {
            painted = true;
            observer.disconnect();
          }
        });
        observer.observe(root, { childList: true });
        window.addEventListener("load", function () {
          if (root.childElementCount > 0) painted = true;
        });
        window.setTimeout(function () {
          if (painted || root.childElementCount > 0) return;
          var build = (window.__MONETA_BUILD__ || "unknown");

          /* диагностика причины: если в странице остался модуль «/src/main.tsx»,
             хостинг отдаёт ИСХОДНИКИ, а не собранную папку dist */
          var srcServed = false;
          var scripts = document.querySelectorAll('script[type="module"]');
          for (var i = 0; i < scripts.length; i++) {
            if ((scripts[i].getAttribute("src") || "").indexOf("main.tsx") !== -1) srcServed = true;
          }

          var title = srcServed ? "сайт отдаёт исходники, а не сборку" : "не удалось загрузить";
          var body = srcServed
            ? "Сервер показывает папку проекта, а не готовое приложение. Откройте <b>Settings → Pages</b> и поставьте <b>Source: GitHub Actions</b> — сборка запустится сама (вкладка Actions). Либо загрузите в репозиторий <b>содержимое папки dist</b> вместо исходников."
            : "Сервер отдал устаревший или неполный файл. Данные не пострадали: они в localStorage устройства.";

          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d120f;color:#e5ebe4;font-family:\'JetBrains Mono\',ui-monospace,monospace;padding:24px;">' +
            '<div style="max-width:560px;width:100%;border:1px solid #37453c;border-radius:14px;padding:28px;background:#141b16;">' +
            '<div style="font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#e3ac45;">монета · ' + title + "</div>" +
            '<div style="margin-top:12px;font-size:13.5px;line-height:1.6;">' + body + "</div>" +
            '<div style="margin-top:10px;font-size:11px;color:#67746a;">сборка ' + build + "</div>" +
            '<div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;">' +
            '<button onclick="location.reload()" style="background:#3ecf8e;color:#0d120f;border:none;border-radius:10px;padding:10px 16px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;">Перезагрузить</button>' +
            '<button onclick="location.reload(true)" style="background:transparent;color:#97a499;border:1px solid #37453c;border-radius:10px;padding:10px 16px;font-size:12.5px;cursor:pointer;font-family:inherit;">Перезагрузить без кэша</button>' +
            "</div>" +
            "</div></div>";
        }, 6000);
      })();
    </script>
  </body>
